name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  # schema/ and corpus/ are generated from pandoc-types and committed: check
  # they are what the pinned pandoc-types gives.
  schema:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Read pins
        run: grep -v "^#" pins.env >> "$GITHUB_ENV"
      - uses: haskell-actions/setup@v2.12.1
        with:
          ghc-version: ${{ env.GHC_VERSION }}
          cabal-version: ${{ env.CABAL_VERSION }}
      - uses: actions/cache@v4
        with:
          path: ~/.cabal/store
          key: schema-${{ env.GHC_VERSION }}-${{ env.INDEX_STATE }}-${{ hashFiles('haskell/*.cabal') }}
      - uses: prefix-dev/setup-pixi@v0.10.2
        with:
          cache: true
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Regenerate
        run: pixi run bash scripts/generate.sh
      # pandoc's corpora come from the pinned pandoc (pins.env), the release
      # binary, not pixi's (conda-forge may lag, or resolve another 3.x)
      - name: Install pandoc ${{ env.PANDOC_VERSION }}
        run: |
          curl -fsSL "https://github.com/jgm/pandoc/releases/download/$PANDOC_VERSION/pandoc-$PANDOC_VERSION-linux-amd64.tar.gz" | tar xz -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/pandoc-$PANDOC_VERSION/bin" >> "$GITHUB_PATH"
      - name: Regenerate pandoc's corpora (its markdown reader, its Lua filters)
        run: |
          pandoc --version | head -1
          bash scripts/pandoc-corpus.sh
          bash scripts/filters-corpus.sh
      - name: Generated files are current
        run: git diff --exit-code

  python:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-15-intel, macos-15, windows-latest]
        env: [py310, py314]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: prefix-dev/setup-pixi@v0.10.2
        with:
          environments: ${{ matrix.env }}
          cache: true
      - name: Lint
        if: matrix.env == 'py314' && matrix.os == 'ubuntu-latest'
        run: pixi run -e py314 lint
      - name: Test the source
        run: pixi run -e ${{ matrix.env }} test-python
      - name: Test the installed wheel
        shell: bash
        run: |
          pixi run -e ${{ matrix.env }} python -m pip wheel --no-deps -w wheelhouse ./python
          pixi run -e ${{ matrix.env }} python -m venv --system-site-packages venv
          if [ -d venv/Scripts ]; then py=venv/Scripts/python; else py=venv/bin/python; fi
          $py -m pip install --no-deps wheelhouse/*.whl
          cp -r python/tests corpus "$RUNNER_TEMP/"
          mkdir -p "$RUNNER_TEMP/python" && mv "$RUNNER_TEMP/tests" "$RUNNER_TEMP/python/"
          cd "$RUNNER_TEMP" && "$GITHUB_WORKSPACE/$py" -m pytest -q python/tests
      - uses: actions/upload-artifact@v4
        if: matrix.env == 'py314' && matrix.os == 'ubuntu-latest'
        with:
          name: python-wheel
          path: wheelhouse/*.whl

  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-15, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - uses: prefix-dev/setup-pixi@v0.10.2
        with:
          cache: true
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      - name: The example runs as a pandoc filter
        shell: bash
        run: |
          cargo build --example upper
          out=$(echo 'some *text*' | pixi run --manifest-path ../pixi.toml pandoc --filter target/debug/examples/upper -t plain)
          echo "$out"
          [ "$out" = "SOME TEXT" ]

  typescript:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: ts
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - uses: prefix-dev/setup-pixi@v0.10.2
        with:
          cache: true
      - run: npm ci
      - run: npx tsc -p tsconfig.test.json
      - run: npm test
      - run: npm run build
      - name: The example runs as a pandoc filter
        run: |
          out=$(echo 'some *text*' | pixi run --manifest-path ../pixi.toml pandoc --filter examples/upper.js -t plain)
          echo "$out"
          [ "$out" = "SOME TEXT" ]

  julia:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15, windows-latest]
        version: ["1.10", "1"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.version }}
      - uses: julia-actions/cache@v2
      - uses: julia-actions/julia-runtest@v1
        with:
          project: julia
      - uses: prefix-dev/setup-pixi@v0.10.2
        with:
          cache: true
      - name: The example runs as a pandoc filter
        if: runner.os != 'Windows'
        run: |
          out=$(echo 'some *text*' | JULIA_PROJECT=$PWD/julia pixi run pandoc --filter julia/examples/upper.jl -t plain)
          echo "$out"
          [ "$out" = "SOME TEXT" ]

  # What the registries would get, on every push: one version everywhere,
  # and each package as it would be published (nothing is published here;
  # see release.yml and RELEASING.md)
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: One version in every language
        run: python3 scripts/version.py
      - uses: astral-sh/setup-uv@v6
      - name: Python (sdist and wheel, twine check)
        run: |
          uv build python -o dist/python
          uvx twine check --strict dist/python/*
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: npm (pack, install the tarball, import it)
        run: |
          cd ts && npm ci && npm pack --pack-destination "$RUNNER_TEMP"
          mkdir -p "$RUNNER_TEMP/try" && cd "$RUNNER_TEMP/try"
          npm init -y >/dev/null && npm install "$RUNNER_TEMP"/panir-*.tgz
          node --input-type=module -e 'import { Str, serialize, parse } from "panir"; import { runFilter } from "panir/node"; console.log(Str("ok").text, typeof runFilter)'
      - uses: dtolnay/rust-toolchain@stable
      - name: crates.io (publish --dry-run)
        working-directory: rust
        run: cargo publish --dry-run
