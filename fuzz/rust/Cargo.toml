[package]
name = "panir-fuzz"
version = "0.0.0"
edition = "2021"
publish = false
description = "The fuzzer's Rust driver (see ../README.md)"

[dependencies]
panir = { path = "../../rust" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
debug-assertions = true
overflow-checks = true

[workspace]
