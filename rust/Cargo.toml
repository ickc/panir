[package]
name = "panir"
version = "0.1.0"
edition = "2021"
# tested: CI runs the tests on it
rust-version = "1.85"
description = "pandoc's document AST, generated from pandoc-types: the types, pandoc's JSON, filters run as pandoc runs Lua filters, visitors"
license = "BSD-3-Clause"
repository = "https://github.com/ickc/panir"
keywords = ["pandoc", "ast", "markdown", "filter"]
categories = ["text-processing", "parser-implementations"]
# the tests that read the repository's corpus (../corpus) aren't packaged
exclude = ["tests/corpus.rs", "tests/filters.rs", "tests/stringify.rs", "tests/package.rs"]

[dependencies]
serde = { version = "1", features = ["derive"] }
# float_roundtrip: a double is read exactly (without it, serde_json reads a
# 17-digit ColWidth one unit in the last place off, and writes another number).
# unbounded_depth: serde_json's limit, 128 levels of JSON, is 42 nested divs
# (a web page's); panir counts the AST's levels itself (MAX_DEPTH).
serde_json = { version = "1", features = ["raw_value", "float_roundtrip", "unbounded_depth"] }

[dev-dependencies]
# the tests compare an error's path with what tracking every value says
serde_path_to_error = "0.1"
