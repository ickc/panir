[workspace]
name = "panir"
channels = ["conda-forge"]
platforms = ["linux-64", "linux-aarch64", "osx-64", "osx-arm64", "win-64"]

[dependencies]
python = ">=3.10"
pytest = "*"
pip = "*"
ruff = "*"
pyright = "*"
# pyright runs on it (unconstrained, the solver may pick a Node too old for it)
nodejs = "26.*"
# as pins.env's PANDOC_VERSION: the tests ask this pandoc
pandoc = "3.14.*"

[feature.py310.dependencies]
python = "3.10.*"

[feature.py314.dependencies]
python = "3.14.*"

[feature.py315.dependencies]
python = "3.15.*"

[feature.ts.dependencies]
typescript = "*"

[environments]
py310 = ["py310"]
py314 = ["py314"]
py315 = ["py315"]
ts = ["ts"]

[tasks]
# everything derived from schema/reified.json and the corpus (no Haskell)
derive = "python tools/derive.py"
gen-python = { cmd = "python tools/gen_python.py && ruff format -q python/src/panir/_types.py", depends-on = ["derive"] }
gen-rust = { cmd = "python tools/gen_rust.py && rustfmt --edition 2021 rust/src/generated.rs", depends-on = ["derive"] }
gen-ts = { cmd = "python tools/gen_ts.py", depends-on = ["derive"] }
gen-julia = { cmd = "python tools/gen_julia.py", depends-on = ["derive"] }
test-python = { cmd = "pytest -q python/tests", env = { PYTHONPATH = "python/src" } }
lint = "ruff check python tools scripts fuzz && ruff format --check python/src python/tests tools scripts fuzz && pyright -p python/pyrightconfig.json"
